site_name: atpx
site_description: "Agentic mathematics workbench: every result is a certificate"
site_url: https://phvv.me/atpx/
repo_url: https://github.com/phvv-me/atpx
repo_name: phvv-me/atpx
copyright: Apache-2.0 - Pedro Valois

theme:
  name: material
  logo: assets/icon.svg
  favicon: assets/icon.svg
  font:
    text: STIX Two Text
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Light mode
  features:
    - navigation.instant
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - content.code.copy
    - toc.integrate

extra_css:
  - stylesheets/theme.css
  - https://unpkg.com/katex@0/dist/katex.min.css

extra_javascript:
  - javascripts/katex.js
  - https://unpkg.com/katex@0/dist/katex.min.js
  - https://unpkg.com/katex@0/dist/contrib/auto-render.min.js

nav:
  - Home: index.md
  - Concepts: concepts.md
  - Guide: guide.md
  - Workflow: workflow.md
  - API: api.md
  - Release: release.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.inlinehilite

hooks:
  - docs/hooks/llms.py

plugins:
  - search
