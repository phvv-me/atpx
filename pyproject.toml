[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "atpx"
version = "0.0.1"
description = "Agentic mathematics workbench: every result is a certificate"
readme = "README.md"
requires-python = ">=3.14"
license = "Apache-2.0"
authors = [{ name = "Pedro Valois", email = "contact@phvv.me" }]
keywords = [
  "atpx",
  "theorem-proving",
  "proof-assistant",
  "provenance",
  "certificate",
  "smt",
  "atp",
  "mathematics",
  "agents",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  "patos>=0.0.6",
  "pydantic>=2.13",
  "cyclopts>=4",
  "plumbum>=2",
  "sympy>=1.14",
  "mpmath>=1.3",
  "python-flint>=0.8",
  "z3-solver>=4.12",
  "cvc5>=1.2",
  "httpx>=0.28",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.6",
  "pyrefly>=1",
  "mypy>=1.11",
  "pytest>=8",
  "hypothesis>=6.100",
  "pytest-cov>=5",
  "syrupy>=4",
  "pytest-subprocess>=1.5",
  "pytest-mock>=3.14",
  "respx>=0.22",
  "faker>=30",
  "dirty-equals>=0.8",
]
docs = ["mkdocs-material>=9.5", "mkdocs-static-i18n>=1.2"]

[project.scripts]
atpx = "atpx.cli:main"

[project.urls]
Homepage = "https://phvv.me/atpx"
Documentation = "https://phvv.me/atpx"
Repository = "https://github.com/phvv-me/atpx"
Issues = "https://github.com/phvv-me/atpx/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/atpx"]

[tool.ruff]
line-length = 99
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

# The package __init__ binds NAME and CONFIG before its re-exports on purpose:
# submodules import them while the package is still initializing, so the
# constants must come first and E402 cannot hold for that one file.
[tool.ruff.lint.per-file-ignores]
"src/atpx/__init__.py" = ["E402"]

[tool.pyrefly]
project-includes = ["src", "tests"]
search-path = ["src", "."]

[tool.mypy]
python_version = "3.14"
strict = true
disallow_any_explicit = true
plugins = ["pydantic.mypy"]
files = ["src"]
mypy_path = "src"
namespace_packages = false

[[tool.mypy.overrides]]
module = ["flint.*", "z3.*", "cvc5.*", "sympy.*", "mpmath.*", "plumbum.*"]
ignore_missing_imports = true

# `disallow_any_explicit` fires on every pydantic model definition: `BaseModel`'s
# stubbed methods carry the only `Any` here, surfaced at each subclass's class
# statement. That is an irreducible third-party-stub gap, not atpx code, so
# `explicit-any` is scoped off for the modules that define models; the flag
# still guards everything else.
[[tool.mypy.overrides]]
module = [
  "atpx.base",
  "atpx.certificate",
  "atpx.blueprint",
  "atpx.workspace",
  "atpx.zettel",
  "atpx.briefing",
  "atpx.background",
  "atpx.adversarial",
]
disable_error_code = ["explicit-any"]

[tool.pytest.ini_options]
addopts = "-q -ra --strict-markers -m 'not integration' --cov=atpx --cov-report=term-missing"
testpaths = ["tests"]
markers = ["integration: hits live external services, deselected by default"]

[tool.coverage.run]
source = ["atpx"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 100
exclude_lines = [
  "pragma: no cover",
  "raise NotImplementedError",
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
  "\\.\\.\\.",
]
