[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "atpx"
version = "0.0.6"
description = "Agentic mathematics workbench: every result is a certificate"
readme = "README.md"
requires-python = ">=3.14"
license = "Apache-2.0"
authors = [{ name = "Pedro Valois", email = "contact@phvv.me" }]
keywords = [
  "atpx",
  "theorem-proving",
  "proof-assistant",
  "provenance",
  "certificate",
  "smt",
  "atp",
  "mathematics",
  "agents",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  "patos>=0.0.8",
  "pydantic>=2.13",
  "cyclopts>=4",
  "plumbum>=2",
  "python-flint>=0.8",
  "httpx>=0.28",
  "tomlkit>=0.13",
  # 3.32 is the floor `core.locking` needs: the sweep unlinks the lock pathname while
  # holding it, and only a filelock that drops a lock won on an already-unlinked inode
  # and retries keeps two writers from ending up inside the section at once.
  "filelock>=3.32",
  # Capped below 3: the 3.x client builds its transport on `httpx2`, a different
  # distribution from the `httpx` respx patches, so every consultation test silently
  # reaches the live API instead of the mock and the counsel lane loses its coverage.
  # Lift the cap once respx (or a replacement) can intercept httpx2.
  "openai>=2.45,<3",
  "rapidfuzz>=3.14",
  "python-slugify>=8.0.4",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.6",
  "pyrefly>=1",
  "mypy>=1.11",
  "pytest>=8",
  "hypothesis>=6.100",
  "pytest-cov>=5",
  "syrupy>=4",
  "pytest-subprocess>=1.5",
  "pytest-mock>=3.14",
  "respx>=0.22",
  "faker>=30",
  "dirty-equals>=0.8",
]
docs = ["mkdocs-material>=9.5"]

[project.scripts]
atpx = "atpx.cli:main"

[project.urls]
Homepage = "https://phvv.me/atpx"
Documentation = "https://phvv.me/atpx"
Repository = "https://github.com/phvv-me/atpx"
Issues = "https://github.com/phvv-me/atpx/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/atpx"]

[tool.mcmr.contextual]
backend = "openrouter"
model = "openai/gpt-5.6-terra"
batch_size = 8

# `Workspace` composes CheckVerbs, StudyVerbs, and CounselVerbs, and CounselVerbs
# itself composes seven single-verb mixins (fit, lean, prove, recall, refute,
# scaffold, settle) over the shared `FoundationState` (an ABC, adding `abc.ABC`
# itself as one more counted ancestor). The rule's own docstring calls the
# ceiling a project decision: 12 is the exact width of atpx's verb surface
# today, decomposed into one mixin per verb rather than a bloated class, so
# the ceiling tracks that count instead of masking further growth.
[tool.mcmr.rules."ALL-CLAS0005"]
policy = { kind = "numeric", maximum = 12 }

# `Frontmatter` is a serialized record rather than a service object, and the rule's own
# Exceptions section says a project owns that ceiling for exactly this reason: the field
# count is not a design choice here, it is the number of keys the `node.md` frontmatter
# contract declares. One key, one field, read tolerantly, is what makes the parse lossless
# and what lets `doctor` report a malformed value by name; folding two keys into one field
# to reach seven would trade a legible contract for the metric. 8 is the contract's width
# today (status, kind, depends, serves, seeds, judgments, superseded_by, problems), so the
# ceiling tracks it and still catches the next unconsidered addition.
[tool.mcmr.rules."ALL-CLAS0004"]
policy = { kind = "numeric", maximum = 8 }

# Four directories sit one module above the ceiling, and each one the rule's own
# Exceptions section argues against splitting. `src/atpx/counsel` holds the two
# counsel agents, the boss mechanic the refuter drives, and the one probe
# toolkit all three share, so the only split available is a forwarding folder
# around a single module. `src/atpx/rigor/audits` is a definition catalog in
# every module but `audit.py`, which carries the witness reader beside the
# `Audit` seam; the exemption would come back only by turning a structural
# Protocol into an inherited base, which trades a seam for a metric.
# The `tests/*` entries mirror source directories that the catalog exemption
# already clears, and a test module declaring several cases can never be a
# catalog itself, so the ceiling would force the test tree to stop mirroring
# the code it tests.
# `src/atpx/graph` is the node contract as a catalog, one module per contract
# face (status, kind, category, frontmatter, journal, node, store), each a
# single small definition its consumers import by name. Folding any two trades
# a legible contract surface for a metric, and the directory grows only when
# the contract itself grows a face.
[tool.mcmr.rules."ALL-FILE0003"]
exclude = [
  "src/atpx/counsel",
  "src/atpx/graph",
  "src/atpx/rigor/audits",
  "tests/blueprint",
  "tests/core",
  "tests/counsel",
  "tests/graph",
  "tests/study",
]

# Both `__getitem__` overloads discriminate a single column name from a list of
# them, and every abstract collection of `str` also admits `str` itself, so an
# abstract `key` makes the two signatures overlap. mypy proves it, rejecting
# `Sequence[str]` here with `Overloaded function signatures 1 and 2 overlap with
# incompatible return types`. The concrete `list` is what pandas declares and
# what keeps the overload resolvable.
[tool.mcmr.rules."PY-COLL0001"]
exclude = [
  "src/atpx/discovery/contracts/frame.py",
  "tests/support/doubles/frame.py",
]

[tool.ruff]
line-length = 99
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyrefly]
project-includes = ["src", "tests"]
search-path = ["src", "."]

[tool.mypy]
python_version = "3.14"
strict = true
disallow_any_explicit = true
plugins = ["pydantic.mypy"]
files = ["src"]
mypy_path = "src"
namespace_packages = false

[[tool.mypy.overrides]]
module = ["flint.*", "plumbum.*", "pysr.*", "pandas.*"]
ignore_missing_imports = true

# `disallow_any_explicit` fires on every pydantic model definition: `BaseModel`'s
# stubbed methods carry the only `Any` here, surfaced at each subclass's class
# statement. That is an irreducible third-party-stub gap, not atpx code, so
# `explicit-any` is scoped off for the modules that define models; the flag
# still guards everything else.
[[tool.mypy.overrides]]
module = [
  "atpx.contracts.*",
  "atpx.core.*",
  "atpx.running.*",
  "atpx.blueprint.*",
  "atpx.discovery.*",
  "atpx.settlement.*",
  "atpx.graph.*",
  "atpx.briefing.*",
  "atpx.background.*",
  "atpx.adversarial.*",
  "atpx.models.*",
  "atpx.counsel.*",
]
disable_error_code = ["explicit-any"]

[tool.pytest.ini_options]
addopts = "-q -ra --import-mode=importlib -m 'not integration' --cov=atpx --cov-report=term-missing"
# The docs tests import the mkdocs hook package `docs.hooks`, resolved from the
# repository root whether pytest runs as `uv run pytest` or `python -m pytest`.
pythonpath = ["."]
strict_config = true
strict_markers = true
strict_parametrization_ids = true
strict_xfail = true
testpaths = ["tests"]
markers = ["integration: hits live external services, deselected by default"]

[tool.coverage.run]
source = ["atpx"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 100
exclude_lines = [
  "pragma: no cover|if TYPE_CHECKING:|if __name__ == .__main__.:|\\.\\.\\.",
]
