site_name: atpx
site_description: "Agentic mathematics workbench: every result is a certificate"
site_url: https://phvv.me/atpx/
repo_url: https://github.com/phvv-me/atpx
repo_name: phvv-me/atpx
copyright: Apache-2.0 - Pedro Valois

theme:
  name: material
  logo: assets/icon.svg
  favicon: assets/icon.svg
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: amber
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Light mode
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - content.code.copy
    - content.code.annotate
    - toc.integrate

extra_css:
  - stylesheets/base.css
  - stylesheets/brand.css

nav:
  - Home: index.md
  - API: api.md
  - Release: release.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.inlinehilite

hooks:
  - docs/hooks/llms.py

plugins:
  - search
  - i18n:
      docs_structure: suffix
      reconfigure_material: true
      reconfigure_search: true
      fallback_to_default: true
      languages:
        - locale: en
          name: 🇺🇸 English
          default: true
        - locale: pt-BR
          name: 🇧🇷 Português (BR)
          build: true
        - locale: es
          name: 🇲🇽 Español
          build: true
        - locale: ja
          name: 🇯🇵 日本語
          build: true
        - locale: zh
          name: 🇨🇳 简体中文
          build: true
